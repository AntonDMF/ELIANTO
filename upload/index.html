<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carica una foto - Elianto</title>
  <link rel="stylesheet" href="../styles.css?v=5">
    <link rel="icon" href="/elianto-favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/elianto-favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/elianto-favicon-16x16.png">
</head>
<body class="hero">
  <div class="overlay">
    <main class="container">
      <section class="upload-card">
        <h1>Carica foto</h1>
        <p class="upload-subtitle">
          Lasciaci un ricordo della giornata: inserisci il tuo nome, scegli una foto e premi “Carica la foto”.
        </p>

        <form id="upload-form" class="upload-form">
          <div class="field">
            <label for="name">Il tuo nome</label>
            <input type="text" id="name" required />
          </div>

          <div class="field">
            <label for="file">Scegli una o più foto</label>
            <input type="file" id="file" accept="image/*" multiple required />
          </div>
          
          <button type="submit" class="btn-upload">
           <span>Carica</span>
            <span class="btn-upload-icon">📷</span>
          </button>
        </form>

        <p id="upload-status" class="upload-status" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <!-- Supabase client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
       const SUPABASE_URL = "https://wyadxtseeimhkdcryybz.supabase.co";
        const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind5YWR4dHNlZWltaGtkY3J5eWJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMzMTgzMDUsImV4cCI6MjA3ODg5NDMwNX0.W2FoLEPlZq9IJd80Is57wy6xdZP2JTDasMur1PtcB_o";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
      auth: { persistSession: false }
    });

    const form = document.getElementById('upload-form');
    const statusEl = document.getElementById('upload-status');

    function setStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.classList.remove('upload-status--success', 'upload-status--error');
      if (type) statusEl.classList.add(type);
    }

    form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const nameInput = document.getElementById('name');
  const fileInput = document.getElementById('file');
  const files = Array.from(fileInput.files);
  const name = nameInput.value.trim();

  if (!files.length) {
    setStatus("Seleziona almeno una foto.", "upload-status--error");
    return;
  }

  setStatus("Caricamento in corso...");

  const safeName = (name || 'ospite')
    .replace(/\s+/g, '_')
    .replace(/[^a-zA-Z0-9_]/g, '');

  const bucket = client.storage.from("uploads");

  try {
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `${Date.now()}_${safeName}_${i + 1}.${ext}`;

      const { error } = await bucket.upload(path, file);
      if (error) {
        console.error(error);
        setStatus(
          `Errore durante il caricamento della foto ${i + 1}: ${error.message}`,
          "upload-status--error"
        );
        return;
      }
    }

    setStatus(
      `Grazie${name ? " " + name : ""}! ${files.length === 1 ? "La tua foto è stata caricata." : `Sono state caricate ${files.length} foto.`}`,
      "upload-status--success"
    );
    form.reset();
  } catch (err) {
    console.error(err);
    setStatus("Errore imprevisto durante il caricamento.", "upload-status--error");
  }
});
  </script>
</body>
</html>
